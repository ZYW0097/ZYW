<p style="color: #666; margin-bottom: 2rem; line-height: 1.6;">
    親愛的用戶您好，<br>
    我們收到了您重置密碼的請求。請點擊下方按鈕來設定新密碼。
</p>

<!-- 重置密碼區塊 -->
<div class="booking-details">
    <h3 style="margin-bottom: 1.5rem; color: #333; font-weight: 700;">密碼重置</h3>
    <div style="text-align: center; margin: 2rem 0;">
        <a href="{{resetUrl}}" style="
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            margin: 1rem 0;
        ">重置密碼</a>
    </div>
    <div class="detail-grid">
        <div class="detail-row">
            <div class="detail-label">重置連結有效時間：</div>
            <div class="detail-value">{{expiryTime}} 分鐘</div>
        </div>
        <div class="detail-row">
            <div class="detail-label">請求時間：</div>
            <div class="detail-value">{{requestTime}}</div>
        </div>
    </div>
</div>

<!-- 安全提醒 -->
<div class="notice-section">
    <div class="notice-title">安全提醒</div>
    <div class="notice-text">
        • 此重置連結將在 {{expiryTime}} 分鐘後失效<br>
        • 如果您沒有要求重置密碼，請忽略此郵件<br>
        • 請勿將此連結分享給他人<br>
        • 建議設定強度較高的新密碼
    </div>
</div>

<p style="color: #666; margin-top: 2rem;">
    如果按鈕無法點擊，請複製以下連結到瀏覽器：<br>
    <span style="color: #007bff; word-break: break-all;">{{resetUrl}}</span>
</p>

<p style="color: #666; margin-top: 1rem;">
    如有任何問題，請聯絡我們的客服團隊。
</p>
