<p style="color: #666; margin-bottom: 2rem; line-height: 1.6;">
    親愛的顧客您好，<br>
    您的訂位已成功取消。如果您需要重新預訂，歡迎隨時透過我們的預訂系統進行。
</p>

<!-- 取消訂位詳情 -->
<div class="booking-details">
    <h3 style="margin-bottom: 1.5rem; color: #333; font-weight: 700;">取消訂位詳情</h3>
    <div class="detail-grid">
        <div class="detail-row">
            <div class="detail-label">餐廳名稱：</div>
            <div class="detail-value">{{clientname}}</div>
        </div>
        <div class="detail-row">
            <div class="detail-label">原用餐日期：</div>
            <div class="detail-value">{{date}}</div>
        </div>
        <div class="detail-row">
            <div class="detail-label">原用餐時間：</div>
            <div class="detail-value">{{time}}</div>
        </div>
        <div class="detail-row">
            <div class="detail-label">取消訂位編號：</div>
            <div class="detail-value">
                <span class="booking-id">{{bookingId}}</span>
            </div>
        </div>
        <div class="detail-row">
            <div class="detail-label">取消時間：</div>
            <div class="detail-value">{{cancelTime}}</div>
        </div>
    </div>
</div>

<!-- 重要提醒 -->
<div class="notice-section">
    <div class="notice-title">服務提醒</div>
    <div class="notice-text">
        • 如需重新預訂，請透過官方預訂系統或電話聯絡<br>
        • 感謝您提前通知取消，讓我們能為其他客人安排座位<br>
        • 期待下次為您服務的機會
    </div>
</div>

<p style="color: #666; margin-top: 2rem;">
    如有任何問題或需要協助，請隨時與我們聯絡。<br>
    謝謝您的理解，期待下次為您服務！
</p>
